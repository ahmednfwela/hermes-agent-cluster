cluster:
  id: bdaya_hermes_cluster
  role: main
  token: ""

node:
  id: windows_desktop_main
  name: windows-desktop-main
  capabilities:
    - planning
    - reviewing
    - scheduling
    - tooling

server:
  bind: "0.0.0.0"
  port: 8787
  tls:
    enabled: false

lease:
  ttl: 60s
  scan_rate: 10s

watchdog:
  check_interval: 5s
  degraded_after: 15s
  offline_after: 30s

heartbeat:
  interval: 30s
  lease_timeout: 120s

reconnect:
  initial_interval: 1s
  max_interval: 60s
  multiplier: 2.0

federation:
  enabled: true
  ping_interval: 30s
  token: ""
