name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hermes_test
          POSTGRES_USER: ci
          # Ephemeral, job-local service container, no host exposure beyond
          # the runner — trust auth means NO password exists anywhere in the
          # repo (#829 secret policy).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d hermes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HERMES_CLUSTER_PG_TEST_DSN: postgresql://ci@localhost:5432/hermes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -e ".[dev,postgres]" pyyaml
      - name: Test
        run: python -m pytest tests_v3 -q
