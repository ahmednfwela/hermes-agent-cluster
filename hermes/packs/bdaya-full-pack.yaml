name: bdaya-full-pack
version: 0.1.0
description: >
  Full Bdaya plugin pack — one-command install of all Bdaya Hermes plugins.
  Includes enforcement (mandate gate, dispatch dedup, proof-or-hedge) and
  doctrine (constitution injection, router, reference docs).
plugins:
  - name: bdaya-enforcement
    repo: "."
    subdir: hermes/plugins/bdaya-enforcement
  - name: bdaya-doctrine
    repo: "."
    subdir: hermes/plugins/bdaya-doctrine
